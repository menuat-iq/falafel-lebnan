<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>فلافل لبنان - المنيو</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF6EC; --card:#FFFFFF; --ink:#2B2A26; --muted:#7A7468;
  --green:#1F6B45; --green-2:#2E8B5A; --red:#C8372D; --gold:#E9A23B;
  --line:#EDE4D3; --chip:#F1E9D8; --shadow:0 6px 20px rgba(60,40,10,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16140F; --card:#211E17; --ink:#F3EEE3; --muted:#A9A190;
    --green:#3FAF74; --green-2:#55C487; --red:#E85A4F; --gold:#F0B455;
    --line:#332E24; --chip:#2A261D; --shadow:0 6px 20px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#16140F; --card:#211E17; --ink:#F3EEE3; --muted:#A9A190;
  --green:#3FAF74; --green-2:#55C487; --red:#E85A4F; --gold:#F0B455;
  --line:#332E24; --chip:#2A261D; --shadow:0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--ink);
  max-width:560px;margin:0 auto;padding-bottom:110px;-webkit-tap-highlight-color:transparent}
.hero{position:relative;background:linear-gradient(160deg,#1F6B45 0%,#155234 100%);
  color:#fff;padding:22px 16px 46px;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -40px -60px auto;width:200px;height:200px;
  border-radius:50%;background:rgba(255,255,255,.06)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.lang{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:999px;
  padding:7px 14px;font:700 14px 'Tajawal';cursor:pointer}
.status{font-size:13px;background:rgba(255,255,255,.14);padding:6px 12px;border-radius:999px}
.status b{color:#9BF0BE}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:64px;height:64px;border-radius:18px;background:#FBF6EC;display:grid;place-items:center;
  font-size:34px;box-shadow:0 4px 14px rgba(0,0,0,.2);flex-shrink:0}
.brand h1{font-size:28px;font-weight:800;line-height:1.1}
.brand p{opacity:.85;font-size:15px;margin-top:4px}
.stripe{height:6px;background:linear-gradient(90deg,var(--red) 0 33%,#fff 33% 66%,var(--red) 66%)}
.info{margin:-30px 16px 0;position:relative;z-index:2;background:var(--card);border-radius:18px;
  box-shadow:var(--shadow);padding:14px;display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.info div{padding:4px}
.info div+div{border-inline-start:1px solid var(--line)}
.info span{display:block;font-size:20px}
.info small{color:var(--muted);font-size:12.5px}
.tabs{position:sticky;top:0;z-index:10;background:var(--bg);display:flex;gap:8px;overflow-x:auto;
  padding:14px 16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;border:0;background:var(--chip);color:var(--ink);padding:9px 16px;border-radius:999px;
  font:700 14px 'Tajawal';cursor:pointer;transition:.2s}
.tab.active{background:var(--green);color:#fff}
section{padding:6px 16px 4px;scroll-margin-top:64px}
section h2{font-size:20px;font-weight:800;margin:10px 0 12px;display:flex;align-items:center;gap:8px}
section h2::after{content:"";flex:1;height:2px;background:var(--line);border-radius:2px}
.item{background:var(--card);border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center;
  margin-bottom:10px;box-shadow:var(--shadow)}
.thumb{width:76px;height:76px;border-radius:14px;display:grid;place-items:center;font-size:38px;
  flex-shrink:0;background:var(--chip);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.body{flex:1;min-width:0}
.name{font-weight:700;font-size:16.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;background:var(--red);color:#fff;padding:2px 8px;border-radius:999px}
.tag.veg{background:var(--green-2)}
.desc{color:var(--muted);font-size:13.5px;margin:3px 0 8px;line-height:1.5}
.row{display:flex;justify-content:space-between;align-items:center}
.price{font-weight:800;color:var(--green);font-size:16px}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:32px;height:32px;border-radius:10px;border:0;font:800 18px 'Tajawal';cursor:pointer}
.plus{background:var(--green);color:#fff}
.minus{background:var(--chip);color:var(--ink)}
.qty span{min-width:16px;text-align:center;font-weight:800}
.offer{background:linear-gradient(135deg,var(--gold),#D9822B);color:#2B1A05;border-radius:18px;padding:16px;
  display:flex;gap:12px;align-items:center;margin-bottom:10px}
.offer .thumb{background:rgba(255,255,255,.35)}
.offer .desc{color:#4A3210}
.offer .price{color:#2B1A05}
.offer .minus{background:rgba(255,255,255,.5);color:#2B1A05}
.loading{text-align:center;color:var(--muted);padding:40px 16px}
footer{text-align:center;color:var(--muted);font-size:13px;padding:24px 16px}
.cart{position:fixed;bottom:0;left:50%;transform:translate(-50%,120%);width:100%;max-width:560px;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));transition:transform .3s ease;z-index:20}
.cart.show{transform:translate(-50%,0)}
.cart a{display:flex;justify-content:space-between;align-items:center;background:#25D366;color:#fff;
  text-decoration:none;border-radius:16px;padding:14px 18px;font-weight:800;font-size:16px;
  box-shadow:0 8px 24px rgba(37,211,102,.4)}
.cart .count{background:rgba(0,0,0,.18);border-radius:10px;padding:2px 10px;margin-inline-end:8px}
</style>
</head>
<body>

<header class="hero">
  <div class="top">
    <span class="status" id="status"></span>
    <button class="lang" id="langBtn">English</button>
  </div>
  <div class="brand">
    <div class="logo">🧆</div>
    <div><h1 id="title"></h1><p id="tagline"></p></div>
  </div>
</header>
<div class="stripe"></div>

<div class="info">
  <div><span>🕐</span><small id="i1"></small></div>
  <div><span>🛵</span><small id="i2"></small></div>
  <div><span>📍</span><small id="i3"></small></div>
</div>

<nav class="tabs" id="tabs"></nav>
<main id="menu"><div class="loading">...</div></main>
<footer id="foot"></footer>

<div class="cart" id="cart">
  <a id="waLink" href="#" target="_blank" rel="noopener">
    <span><span class="count" id="cCount">0</span><span id="cLabel"></span></span>
    <span id="cTotal"></span>
  </a>
</div>

<script>
/* ============ الإعدادات: غيّر هذه فقط ============ */

// رابط جدول Google Sheets (رابط المشاركة العادي). إذا تركته فارغ يشتغل المنيو بالأصناف التجريبية
const SHEET_URL = "https://docs.google.com/spreadsheets/d/1hekZUMqYZXJetl5QjfnLf-KpS1JcLz3NOaiHKVJe3vg/edit?usp=drivesdk";

// رقم واتساب المطعم بالصيغة الدولية بدون +
const WHATSAPP = "9647700977515";

/* ================================================ */

const T = {
  ar:{title:"فلافل لبنان",tagline:"طعم بيروت الأصلي... كل يوم طازج",open:"<b>●</b> مفتوح الآن",
      i1:"١٠ص - ١٢م",i2:"توصيل سريع",i3:"شارع المطاعم",cur:"د.ع",
      order:"اطلب على واتساب",foot:"الأسعار بالدينار العراقي",
      msg:"مرحباً فلافل لبنان، أريد أطلب:",total:"المجموع",lang:"English",
      veg:"نباتي",hot:"الأكثر طلباً",empty:"المنيو غير متوفر حالياً"},
  en:{title:"Falafel Lebnan",tagline:"Authentic Beirut taste... fresh every day",open:"<b>●</b> Open now",
      i1:"10am - 12am",i2:"Fast delivery",i3:"Restaurants St.",cur:"IQD",
      order:"Order on WhatsApp",foot:"Prices in Iraqi Dinar",
      msg:"Hello Falafel Lebnan, I'd like to order:",total:"Total",lang:"عربي",
      veg:"Veg",hot:"Best seller",empty:"Menu unavailable right now"}
};

// الأصناف التجريبية (نفس محتوى ملف الجدول)
const DEMO_CSV = "القسم,Category,الاسم,Name,الوصف,Description,السعر,ايموجي,صورة,شارة,متوفر\nالعروض,Offers,وجبة العائلة,Family Meal,\"٤ سندويشات فلافل، صحن حمص، فتوش، بطاطا كبيرة و٤ عيران\",\"4 falafel wraps, hummus, fattoush, large fries & 4 ayran\",15000,🎉,,عرض,نعم\nالسندويشات,Sandwiches,فلافل عادي,Classic Falafel,\"فلافل مقرمشة، طحينة، طماطم وخيار مخلل\",\"Crispy falafel, tahini, tomato & pickles\",1500,🌯,,نباتي,نعم\nالسندويشات,Sandwiches,فلافل سبيشل,Special Falafel,\"فلافل مع بطاطا، خضار مشكلة، طحينة ودبس رمان\",\"Falafel with fries, mixed veggies, tahini & pomegranate\",2500,🥙,,الأكثر طلباً,نعم\nالسندويشات,Sandwiches,فلافل بالجبن,Cheese Falafel,فلافل محشية جبن موزاريلا ذايبة,Falafel stuffed with melted mozzarella,3000,🧀,,,نعم\nالسندويشات,Sandwiches,صاج فلافل,Saj Falafel,خبز صاج رقيق محمّص مع فلافل وخضار,Thin toasted saj bread with falafel & veggies,3000,🫓,,,نعم\nالسندويشات,Sandwiches,شاورما دجاج,Chicken Shawarma,\"دجاج متبّل، ثوم، بطاطا ومخلل\",\"Marinated chicken, garlic sauce, fries & pickles\",3500,🍗,,,نعم\nالصحون,Plates,صحن فلافل,Falafel Plate,٦ قطع فلافل مع طحينة وخضار وخبز,\"6 falafel pieces with tahini, veggies & bread\",4000,🧆,,نباتي,نعم\nالصحون,Plates,حمص,Hummus,حمص كريمي بزيت الزيتون,Creamy hummus with olive oil,3000,🥣,,نباتي,نعم\nالصحون,Plates,حمص باللحمة,Hummus with Meat,حمص مع لحم مفروم وصنوبر,Hummus topped with minced meat & pine nuts,6000,🥩,,,نعم\nالصحون,Plates,متبل,Moutabal,باذنجان مشوي مع طحينة ورمان,Smoky eggplant with tahini & pomegranate,3000,🍆,,نباتي,نعم\nالصحون,Plates,فتة حمص,Fatteh,\"خبز محمص، حمص، لبن وطحينة\",\"Toasted bread, chickpeas, yogurt & tahini\",5000,🍲,,,نعم\nالسلطات والمقبلات,Salads & Sides,تبولة,Tabbouleh,\"بقدونس، برغل، طماطم وليمون\",\"Parsley, bulgur, tomato & lemon\",3000,🥗,,نباتي,نعم\nالسلطات والمقبلات,Salads & Sides,فتوش,Fattoush,\"خضار طازجة، خبز مقرمش ودبس رمان\",\"Fresh veggies, crispy bread & pomegranate molasses\",3000,🥬,,نباتي,نعم\nالسلطات والمقبلات,Salads & Sides,بطاطا مقلية,French Fries,بطاطا ذهبية مقرمشة,Golden crispy fries,2000,🍟,,,نعم\nالسلطات والمقبلات,Salads & Sides,بطاطا حرّة,Batata Harra,بطاطا بالثوم والكزبرة والفلفل,Spicy potatoes with garlic & coriander,2500,🌶️,,,نعم\nالمشروبات,Drinks,عيران,Ayran,لبن بارد,Chilled yogurt drink,750,🥛,,,نعم\nالمشروبات,Drinks,ليمون بالنعناع,Lemon Mint,عصير طازج,Fresh juice,2000,🍋,,,نعم\nالمشروبات,Drinks,مشروب غازي,Soft Drink,\"بيبسي، سفن أب، ميرندا\",\"Pepsi, 7Up, Mirinda\",750,🥤,,,نعم\nالمشروبات,Drinks,شاي,Tea,شاي عراقي مهيّل,Iraqi cardamom tea,500,🍵,,,نعم\n";

/* ---------- قراءة الجدول ---------- */
function parseCSV(text){
  const rows=[]; let row=[], f="", q=false;
  text = text.replace(/^\uFEFF/,"");
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q=false; }
      else f+=c;
    }else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=""; }
    else if(c==='\n'||c==='\r'){
      if(c==='\r'&&text[i+1]==='\n') i++;
      row.push(f); rows.push(row); row=[]; f="";
    }else f+=c;
  }
  if(f!==""||row.length){ row.push(f); rows.push(row); }
  return rows.filter(r=>r.some(x=>x.trim()!==""));
}

const toLatin = s => String(s||"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d));
const esc = s => String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function buildMenu(csv){
  const rows = parseCSV(csv).slice(1); // أول سطر عناوين
  const cats = [], byName = {};
  rows.forEach(r=>{
    const [catAr,catEn,ar,en,dar,den,price,emoji,img,badge,avail] = r.map(x=>(x||"").trim());
    if(!ar || !catAr) return;
    const a = avail.toLowerCase();
    if(["لا","no","0","false","x"].includes(a)) return;
    const p = parseInt(toLatin(price).replace(/[^\d]/g,""),10) || 0;
    const b = badge.toLowerCase();
    let tag="", offer=false;
    if(b.includes("نباتي")||b==="veg") tag="veg";
    else if(b.includes("طلب")||b==="hot"||b.includes("best")) tag="hot";
    else if(b.includes("عرض")||b==="offer") offer=true;
    if(!byName[catAr]){ byName[catAr]={id:"c"+cats.length,ar:catAr,en:catEn||catAr,items:[]}; cats.push(byName[catAr]); }
    byName[catAr].items.push({ar,en:en||ar,dar,den:den||dar,p,e:emoji||"🍽️",img,tag,offer});
  });
  return cats;
}

function sheetCsvUrl(u){
  if(!u) return "";
  if(/output=csv|tqx=out:csv/.test(u)) return u;
  const m = u.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
  return m ? `https://docs.google.com/spreadsheets/d/${m[1]}/gviz/tq?tqx=out:csv` : u;
}

/* ---------- العرض ---------- */
let lang="ar", MENU=[];
const cart={};
try{ const s=localStorage.getItem("fl_lang"); if(s) lang=s; }catch(e){}

const fmt = n => n.toLocaleString("en-US")+" "+T[lang].cur;
const allItems = () => MENU.flatMap(c=>c.items.map((it,i)=>({...it,key:c.id+"_"+i})));

function render(){
  const t=T[lang];
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  title.textContent=t.title; tagline.textContent=t.tagline;
  status.innerHTML=t.open; langBtn.textContent=t.lang;
  i1.textContent=t.i1; i2.textContent=t.i2; i3.textContent=t.i3; foot.textContent=t.foot;
  document.title=t.title;
  if(!MENU.length){ tabs.innerHTML=""; menu.innerHTML=`<div class="loading">${t.empty}</div>`; updateCart(); return; }

  tabs.innerHTML = MENU.map((c,i)=>`<button class="tab${i?"":" active"}" data-id="${c.id}">${esc(c[lang])}</button>`).join("");
  menu.innerHTML = MENU.map(c=>`
    <section id="${c.id}"><h2>${esc(c[lang])}</h2>
    ${c.items.map((it,i)=>{
      const key=c.id+"_"+i, q=cart[key]||0;
      const tag = it.tag ? `<span class="tag ${it.tag==="veg"?"veg":""}">${t[it.tag]}</span>` : "";
      const pic = it.img ? `<img src="${esc(it.img)}" alt="" loading="lazy">` : esc(it.e);
      return `<div class="${it.offer?"offer":"item"}">
        <div class="thumb">${pic}</div>
        <div class="body">
          <div class="name">${esc(it[lang])} ${tag}</div>
          <div class="desc">${esc(lang==="ar"?it.dar:it.den)}</div>
          <div class="row">
            <span class="price">${fmt(it.p)}</span>
            <div class="qty">
              ${q?`<button class="minus" data-k="${key}" data-d="-1">−</button><span>${q}</span>`:""}
              <button class="plus" data-k="${key}" data-d="1">+</button>
            </div>
          </div>
        </div></div>`;}).join("")}
    </section>`).join("");
  updateCart();
}

function updateCart(){
  const t=T[lang], items=allItems().filter(it=>cart[it.key]);
  const count=items.reduce((s,it)=>s+cart[it.key],0);
  const total=items.reduce((s,it)=>s+cart[it.key]*it.p,0);
  document.getElementById("cart").classList.toggle("show",count>0);
  cCount.textContent=count; cLabel.textContent=t.order; cTotal.textContent=fmt(total);
  const lines=items.map(it=>`• ${cart[it.key]} × ${it[lang]} = ${fmt(cart[it.key]*it.p)}`);
  waLink.href=`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(`${t.msg}\n${lines.join("\n")}\n\n${t.total}: ${fmt(total)}`)}`;
}

document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.id==="langBtn"){ lang=lang==="ar"?"en":"ar"; try{localStorage.setItem("fl_lang",lang);}catch(err){} render(); return; }
  if(b.classList.contains("tab")){ document.getElementById(b.dataset.id).scrollIntoView({behavior:"smooth"}); return; }
  if(b.dataset.k){
    const k=b.dataset.k; cart[k]=Math.max(0,(cart[k]||0)+Number(b.dataset.d));
    if(!cart[k]) delete cart[k];
    const y=window.scrollY; render(); window.scrollTo(0,y);
  }
});

window.addEventListener("scroll",()=>{
  let cur=MENU[0]&&MENU[0].id;
  MENU.forEach(c=>{ const s=document.getElementById(c.id); if(s&&s.getBoundingClientRect().top<120) cur=c.id; });
  document.querySelectorAll(".tab").forEach(t=>{
    const on=t.dataset.id===cur;
    if(on&&!t.classList.contains("active")) t.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});
    t.classList.toggle("active",on);
  });
},{passive:true});

/* ---------- التشغيل ---------- */
async function load(){
  const url = sheetCsvUrl(SHEET_URL);
  if(!url){ MENU=buildMenu(DEMO_CSV); render(); return; }
  // اعرض آخر نسخة محفوظة فوراً حتى لو النت بطيء
  try{ const c=localStorage.getItem("fl_menu"); if(c){ MENU=buildMenu(c); render(); } }catch(e){}
  try{
    const res = await fetch(url,{cache:"no-store"});
    if(!res.ok) throw new Error(res.status);
    const csv = await res.text();
    const m = buildMenu(csv);
    if(!m.length) throw new Error("empty");
    MENU=m; render();
    try{ localStorage.setItem("fl_menu",csv); }catch(e){}
  }catch(err){
    console.warn("تعذر تحميل الجدول:",err);
    if(!MENU.length){ MENU=buildMenu(DEMO_CSV); render(); }
  }
}
load();
</script>
</body>
</html>
